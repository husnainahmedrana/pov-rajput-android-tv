name: Announce a release on Discord

# Re-posts a published release to the Discord #releases channel (the release job does this once on its own).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.3.24-rajput
        required: true

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Announce the release on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_REPO: ${{ github.repository }}
        run: |
          git fetch --depth=1 origin main
          git show origin/main:scripts/announce-discord.py > /tmp/announce-discord.py
          python3 /tmp/announce-discord.py docs/RELEASE_NOTES.md "${{ inputs.tag }}" "$GH_REPO"
